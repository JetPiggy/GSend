<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Send files and text between your devices. No cables, no chat apps: browser to browser, nothing stored on a server."
    />
    <title>GSend — device to device transfer</title>
    <!-- Work mode is decided before the first paint, so the pig never flashes up on a
         screen that asked for words only. src/ui/work.ts owns it from here. -->
    <script>
      (function () {
        var on = false;
        try { on = localStorage.getItem("gsend.work") === "1"; } catch (e) {}
        if (new URLSearchParams(location.search).get("w") === "1") on = true;
        if (on) document.documentElement.classList.add("work");
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/GSendDigits.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GSendUI.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#F7F3E8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS still reads the vendor-prefixed pair; it is what gives an installed copy
         its own storage treatment rather than sharing Safari's. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GSend" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
